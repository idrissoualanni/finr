; FIN-R API — réglages PHP pour la production ( Render / conteneur )
; Chargé après le php.ini de l'image, donc il l'emporte sur les valeurs par défaut.

; ── Opcodes ────────────────────────────────────────────────────────────────
; Sur un service court (free tier), Render recycle l'instance régulièrement :
; un opcache non persistant se recompile à chaque démarrage. On garde une
; mémoire modeste mais un bytecode warmed dès la première requête.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

; ── Ressources ─────────────────────────────────────────────────────────────
; dompdf rend le rapport de session : 256M suffisent largement.
memory_limit = 256M
; Une requête qui dépasse 60 s doit échouer, pas pendre jusqu'au timeout Render.
max_execution_time = 60
post_max_size = 12M
upload_max_filesize = 12M

; ── Erreurs ────────────────────────────────────────────────────────────────
; En production : jamais d'affichage, tout part dans les logs Render.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE

; ── Divers ─────────────────────────────────────────────────────────────────
expose_php = Off
date.timezone = UTC
; Un cron PHP interne n'a pas lieu d'être ici : le job est un service Render.
